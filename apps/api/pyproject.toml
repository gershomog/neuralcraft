[project]
name = "nq-api"
version = "4.1.3"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "anthropic>=2.12.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
    "supabase>=2.34.1",
    "vaderSentiment>=3.3.2",
    "nq-data",
    "nq-signals",
    "slack-bolt>=1.30.0",
    "slack-sdk>=3.48.0",
    "psycopg2-binary>=2.9.13",
    "livekit>=1.3.0",
    "stripe>=17.1.0",
    "boto3>=1.44.9",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
test = ["pytest>=9.2.0", "httpx>=0.28.1", "pytest-asyncio>=1.5.0"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nq_api"]

[tool.uv.sources]
nq-data = { workspace = true }
nq-signals = { workspace = true }
